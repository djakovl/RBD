[package]
name = "faculty-mongo-client"
version = "1.0.0"
edition = "2021"
default-run = "faculty-mongo-client"

[[bin]]
name = "faculty-mongo-client"
path = "src/main.rs"

[[bin]]
name = "fake_data"
path = "src/bin/fake_data.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
dotenvy = "0.15"
mongodb = { version = "2.8", default-features = false, features = ["sync"] }
rand = "0.8"
